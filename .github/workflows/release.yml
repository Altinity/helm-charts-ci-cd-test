name: Release Charts

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install chart-releaser
        run: |
          curl -sSLo cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/v1.6.1/chart-releaser_1.6.1_linux_amd64.tar.gz"
          tar -xzf cr.tar.gz
          sudo mv cr /usr/local/bin/cr

      - name: Add Operator Chart Repo
        run: |
          helm repo add altinity-operator https://docs.altinity.com/clickhouse-operator
          helm repo add altinity https://helm.altinity.com/

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        continue-on-error: false

      - name: Merge operator index
        run: |
          # Checkout fresh copy of gh-pages branch
          git fetch origin gh-pages
          git checkout gh-pages
          
          # Download operator index.yaml
          curl -sL https://docs.altinity.com/clickhouse-operator/index.yaml -o operator-index.yaml
          
          # Use chart-releaser to merge the indexes
          if [ -f "index.yaml" ]; then
            cr index --merge operator-index.yaml --index-path index.yaml
          else
            cp operator-index.yaml index.yaml
          fi
          
          # Clean up
          rm -f operator-index.yaml
          
          # Commit and push the updated index
          git add index.yaml
          git commit -m "Merge operator charts index" || echo "No changes to commit"
          git push origin gh-pages

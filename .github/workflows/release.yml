name: Release Charts

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Add Operator Chart Repo
        run: |
          helm repo add altinity-operator https://docs.altinity.com/clickhouse-operator
          helm repo add altinity https://helm.altinity.com/

      - name: Download Latest ClickHouse Operator Chart
        run: |
          # Get the latest version from the operator repo index
          curl -sL https://docs.altinity.com/clickhouse-operator/index.yaml -o operator-index.yaml
          
          # Extract the latest version and URL
          LATEST_VERSION=$(yq eval '.entries.altinity-clickhouse-operator[0].version' operator-index.yaml)
          LATEST_URL=$(yq eval '.entries.altinity-clickhouse-operator[0].urls[0]' operator-index.yaml)
          
          echo "Downloading ClickHouse Operator version $LATEST_VERSION from $LATEST_URL"
          
          # Create operator chart directory if it doesn't exist
          mkdir -p charts/altinity-clickhouse-operator
          
          # Download and extract the tarball
          curl -sL "$LATEST_URL" -o "charts/altinity-clickhouse-operator-${LATEST_VERSION}.tgz"
          tar -xzf "charts/altinity-clickhouse-operator-${LATEST_VERSION}.tgz" -C charts/
          
          # Clean up
          rm -f operator-index.yaml
          rm -f "charts/altinity-clickhouse-operator-${LATEST_VERSION}.tgz"
          
          echo "ClickHouse Operator chart $LATEST_VERSION placed in charts directory"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

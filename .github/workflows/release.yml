name: Release Charts

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install chart-releaser
        run: |
          curl -sSLo cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/v1.6.1/chart-releaser_1.6.1_linux_amd64.tar.gz"
          tar -xzf cr.tar.gz
          sudo mv cr /usr/local/bin/cr

      - name: Add Operator Chart Repo
        run: |
          helm repo add altinity-operator https://docs.altinity.com/clickhouse-operator
          helm repo add altinity https://helm.altinity.com/

      - name: Package and release charts
        run: |
          # Find changed charts
          for chart_dir in charts/*; do
            if [[ -d "$chart_dir" ]]; then
              chart_name=$(basename "$chart_dir")
              chart_version=$(grep '^version:' "$chart_dir/Chart.yaml" | cut -d' ' -f2)
              
              # Check if this version already exists as a release
              if gh release view "${chart_name}-${chart_version}" >/dev/null 2>&1; then
                echo "Release ${chart_name}-${chart_version} already exists, skipping..."
                continue
              fi
              
              echo "Processing chart: $chart_name version $chart_version"
              
              # Package the chart
              cr package "$chart_dir"
              
              # Create GitHub release
              gh release create "${chart_name}-${chart_version}" \
                --title "${chart_name}-${chart_version}" \
                --notes "Release of ${chart_name} chart version ${chart_version}"
              
              # Upload chart package to release
              gh release upload "${chart_name}-${chart_version}" \
                .cr-release-packages/"${chart_name}-${chart_version}.tgz"
            fi
          done
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Update Helm repository index
        run: |
          # Generate index from releases BEFORE switching branches
          cr index --owner ${{ github.repository_owner }} --git-repo $(basename ${{ github.repository }}) --pages-branch gh-pages
          
          # Save the generated index
          cp index.yaml charts-index.yaml
          
          # Fetch gh-pages branch
          git fetch origin gh-pages:gh-pages
          
          # Switch to gh-pages branch (force checkout to avoid conflicts)
          git checkout -f gh-pages
          
          # Restore the charts index
          cp charts-index.yaml index.yaml
          
          # Download operator index
          curl -sL https://docs.altinity.com/clickhouse-operator/index.yaml -o operator-index.yaml
          
          # Merge the operator index into our charts index
          helm repo index . --merge index.yaml --merge operator-index.yaml
          
          # Clean up
          rm -f operator-index.yaml charts-index.yaml
          
          # Commit and push the updated index
          git add index.yaml
          git commit -m "Update Helm repository index with operator charts" || echo "No changes to commit"
          git push origin gh-pages
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

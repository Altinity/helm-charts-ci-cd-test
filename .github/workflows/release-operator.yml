name: Release Charts

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Merge and upload helm index with operator index
        run: |
          git fetch origin gh-pages:gh-pages
          git checkout -f gh-pages
          curl -sL https://docs.altinity.com/clickhouse-operator/index.yaml -o operator-index.yaml
          helm repo index . --merge index.yaml --merge operator-index.yaml
          rm -f operator-index.yaml
          
          # Commit and push the updated index
          git add index.yaml
          git commit -m "Update Helm repository index with operator charts" || echo "No changes to commit"
          git push origin gh-pages
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
